<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>{{ program.name }} · Damga kartı afişi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Onest:wght@400..700&display=swap">
<style>
@page{size:A6;margin:0}
*{box-sizing:border-box;margin:0}
body{background:#e9ece9;font-family:Onest,sans-serif;color:#17201C;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
.sheet{width:105mm;height:148mm;background:#133126;color:#fff;border-radius:6mm;padding:9mm 8mm;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.biz{font:800 7mm/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.kick{margin-top:2mm;font-size:3.4mm;color:#CFE3DA;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
h1{margin-top:5mm;font:800 8.6mm/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
h1 span{color:#FF8A6A}
.qr{margin-top:5mm;width:46mm;height:46mm;background:#fff;border-radius:4mm;padding:2.5mm}
.qr svg{width:100%;height:100%;display:block}
.how{margin-top:5mm;font-size:3.6mm;line-height:1.4;color:#CFE3DA}
.how b{color:#fff}
.nfc{margin-top:auto;display:flex;align-items:center;gap:2mm;font-size:3.2mm;color:#CFE3DA}
.nfc i{width:6mm;height:6mm;border:.5mm solid #CFE3DA;border-radius:50%;display:inline-block}
.tools{display:flex;gap:10px}
button{font:600 15px Onest,sans-serif;border:0;border-radius:999px;padding:12px 22px;background:#1E5B47;color:#fff;cursor:pointer}
@media print{body{background:none;padding:0}.tools{display:none}.sheet{border-radius:0}}
</style></head><body>
<div class="tools"><button onclick="window.print()">Yazdır</button></div>
<div class="sheet">
  <div class="biz">{{ program.name }}</div>
  <div class="kick">Damga kartı</div>
  <h1>Her {{ program.stamps_required }} damgada<br><span>{{ program.reward }}</span></h1>
  <div class="qr" id="qr"></div>
  <p class="how">Kameranla okut ya da telefonunu dokundur.<br><b>İlk ziyaretinde {{ program.welcome_stamps }} damga hediye.</b></p>
  <div class="nfc"><i></i>NFC · telefonunu buraya dokundur</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>var q=qrcode(0,"M");q.addData({{ join_url|tojson }});q.make();document.getElementById("qr").innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true});</script>
</body></html>
