{% extends "base.html" %}
{% block title %}Yeni şifre · SiparişGeldi{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <a href="{{ url_for('public.landing') }}" class="brand"><span class="dot"></span> SiparişGeldi</a>
    <div class="card">
      <h2 style="text-align:center">Yeni şifre belirle</h2>
      {% include "_flashes.html" %}
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label>Yeni şifre</label>
          <input type="password" name="password" required autofocus minlength="{{ min_password_length }}" placeholder="En az {{ min_password_length }} karakter">
        </div>
        <div class="field">
          <label>Yeni şifre (tekrar)</label>
          <input type="password" name="confirm_password" required minlength="{{ min_password_length }}" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Şifreyi güncelle</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
