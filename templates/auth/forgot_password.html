{% extends "base.html" %}
{% block title %}Şifremi unuttum · SiparişGeldi{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <a href="{{ url_for('public.landing') }}" class="brand"><span class="dot"></span> SiparişGeldi</a>
    <div class="card">
      <h2 style="text-align:center">Şifremi unuttum</h2>
      <p class="muted" style="text-align:center;margin:-.2rem 0 1rem">Kayıtlı e-postanı yaz; sıfırlama bağlantısını e-postana ve bağlıysa Telegram'ına gönderelim.</p>
      {% include "_flashes.html" %}
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label>E-posta</label>
          <input type="email" name="email" required autofocus placeholder="ornek@restoran.com">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Sıfırlama bağlantısı gönder</button>
      </form>
    </div>
    <p class="auth-alt"><a href="{{ url_for('auth.login') }}" style="color:var(--brand);font-weight:700">← Girişe dön</a></p>
  </div>
</div>
{% endblock %}
