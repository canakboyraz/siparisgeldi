{% extends "base.html" %}
{% block title %}Giriş · SiparişGeldi{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <a href="{{ url_for('public.landing') }}" class="brand"><span class="brand-mark" aria-hidden="true"></span> SiparişGeldi</a>
    <div class="card">
      <h2 style="text-align:center">Tekrar hoş geldin</h2>
      {% include "_flashes.html" %}
      {% include "auth/_google_button.html" %}
      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label>E-posta</label>
          <input type="email" name="email" required autofocus placeholder="ornek@restoran.com">
        </div>
        <div class="field">
          <label>Şifre</label>
          <input type="password" name="password" required placeholder="••••••••">
        </div>
        <p class="hint" style="text-align:right;margin:-.6rem 0 1rem"><a href="{{ url_for('auth.forgot_password') }}" style="color:var(--brand);font-weight:600">Şifremi unuttum</a></p>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Giriş yap</button>
      </form>
    </div>
    <p class="auth-alt">Hesabın yok mu? <a href="{{ url_for('auth.register') }}" style="color:var(--brand);font-weight:700">Kayıt ol</a></p>
    <form method="post" action="{{ url_for('auth.start_demo') }}" class="auth-alt">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="link-button">Hesap açmadan demoyu gör</button>
    </form>
  </div>
</div>
{% endblock %}
